*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 8px}.tabs button{width:auto;margin:0;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 12px;font-size:14px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.ev{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--bd)}.f{color:var(--ok)}.u{color:var(--bad)}
@media(max-width:520px){ul{columns:1}}svg{width:100%;height:auto}
</style></head><body>

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d64(BLOB.salt),iterations:BLOB.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(BLOB.iv)},key,d64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const $=s=>document.querySelector(s);

function chart(h){
  if(h.length<2)return '<p class="mut">Chart appears after 2+ snapshots.</p>';
  const W=800,H=200,p=30,xs=h.map(x=>x.ts),mn=Math.min(...xs),mx=Math.max(...xs);
  const vals=h.map(x=>x.followers),lo=Math.min(...vals),hi=Math.max(...vals),r=(hi-lo)||1;
  const X=t=>p+(t-mn)/((mx-mn)||1)*(W-2*p),Y=v=>H-p-(v-lo)/r*(H-2*p);
  const pts=h.map(x=>X(x.ts)+','+Y(x.followers)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${pts}"/>
  <text x="4" y="${Y(hi)+4}" fill="var(--mut)" font-size="12">${hi}</text><text x="4" y="${Y(lo)+4}" fill="var(--mut)" font-size="12">${lo}</text></svg>`;
}
function render(D){
  $('#lock').hidden=true;const a=$('#app');a.hidden=false;
  const h=D.history,last7=h.filter(x=>x.ts>D.ts-7*864e2*1e0*1).length;
  const wk=h.find(x=>x.ts>=D.ts-7*86400);const delta=wk?D.followers-wk.followers:0;
  const ev30=D.events.filter(e=>e.ts>D.ts-30*86400);
  const gained=ev30.filter(e=>e.kind==='follow').length,lost=ev30.filter(e=>e.kind==='unfollow').length;
  const ratio=D.following?(D.followers/D.following).toFixed(2):'-';
  const lists={'Not following me back':D.not_following_back,"I don't follow back":D.fans,'Mutuals':D.mutuals};
  a.innerHTML=`<h1>FollowMeter</h1><div class="mut">Updated ${new Date(D.ts*1000).toLocaleString()}</div>
  <div class="tiles">
   <div class="tile"><span class="mut">Followers</span><b>${D.followers}</b></div>
   <div class="tile"><span class="mut">Following</span><b>${D.following}</b></div>
   <div class="tile"><span class="mut">7 days</span><b class="${delta>=0?'f':'u'}">${delta>=0?'+':''}${delta}</b></div>
   <div class="tile"><span class="mut">30d gained / lost</span><b><span class="f">+${gained}</span> / <span class="u">-${lost}</span></b></div>
   <div class="tile"><span class="mut">Follower ratio</span><b>${ratio}</b></div>
   <div class="tile"><span class="mut">Mutuals</span><b>${D.mutuals.length}</b></div></div>
  <div class="card"><b>Followers over time</b>${chart(h)}</div>
  <div class="tabs" id="tabs"></div><div class="card" id="list"></div>
  <div class="card"><b>Recent activity</b><div id="ev"></div></div>`;
  const names=Object.keys(lists),t=$('#tabs');
  const show=n=>{[...t.children].forEach(b=>b.classList.toggle('on',b.textContent.startsWith(n)));
    $('#list').innerHTML=`<ul>${lists[n].map(u=>`<li><a href="https://instagram.com/${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')||'<li class="mut">Nobody</li>'}</ul>`};
  names.forEach(n=>{const b=document.createElement('button');b.textContent=`${n} (${lists[n].length})`;b.onclick=()=>show(n);t.appendChild(b)});
  show(names[0]);
  $('#ev').innerHTML=D.events.slice(0,60).map(e=>`<div class="ev"><span class="mut">${new Date(e.ts*1000).toLocaleDateString()}</span>
   <span class="${e.kind==='follow'?'f':'u'}">${e.kind==='follow'?'+ followed':'− unfollowed'}</span> ${esc(e.username)}</div>`).join('')||'<p class="mut">No changes yet.</p>';
}
