<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#ffffff"><title>FollowMeter</title>
<style>
:root{--bg:#fff;--tx:#262626;--mut:#737373;--bd:#dbdbdb;--soft:#efefef;--blue:#0095f6;--red:#ff3040;--ok:#00a35a}
@media(prefers-color-scheme:dark){:root{--bg:#000;--tx:#f5f5f5;--mut:#a8a8a8;--bd:#262626;--soft:#262626;--ok:#3ddc84}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:470px;margin:0 auto;min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:700;font-size:20px}
header small{font-weight:400;font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav div{display:flex;width:100%;max-width:470px}
nav button{flex:1;background:none;border:0;padding:13px 0;color:var(--tx);cursor:pointer;position:relative}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{stroke-width:2.8}.dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:17px;padding:0 4px;text-align:center}
.av{border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mut);font-weight:600;flex:none;overflow:hidden}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);flex:none;display:inline-block}
.ring>span{display:block;padding:2px;border-radius:50%;background:var(--bg)}.ring.off{background:var(--bd)}
.prof{display:flex;align-items:center;gap:22px;padding:16px}.counts{display:flex;flex:1;justify-content:space-around;text-align:center}
.counts b{display:block;font-size:17px}.counts span{font-size:13px}
.bio{padding:0 16px 12px}.bio b{display:block}
.btns{display:flex;gap:8px;padding:0 16px 14px}
.btn{flex:1;text-align:center;border:0;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;background:var(--soft);color:var(--tx);cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.blue{background:var(--blue);color:#fff}.btn.sm{flex:none;padding:6px 14px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;width:72px;font-size:12px;text-decoration:none;color:var(--tx)}.st i{font-style:normal;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.sec{padding:10px 16px 6px;font-weight:700;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.grid div{padding:14px 8px;text-align:center;border-right:1px solid var(--bd)}.grid div:last-child{border:0}.grid b{display:block;font-size:20px}.grid span{color:var(--mut);font-size:12px}
.up{color:var(--ok)}.down{color:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:8px 16px;text-decoration:none;color:var(--tx)}
.row .t{flex:1;min-width:0}.row .t b,.row .t span{display:block;overflow:hidden;text-overflow:ellipsis}.row .t span{color:var(--mut)}.row .t b{font-weight:600}
.row .t p{margin:0}.row .t em{font-style:normal;color:var(--mut)}
.tabs{display:flex;border-bottom:1px solid var(--bd)}.tabs button{flex:1;background:none;border:0;border-bottom:1px solid transparent;padding:11px 2px;color:var(--mut);font-weight:600;font-size:13px;cursor:pointer;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--tx)}
.search{margin:10px 16px;display:block;width:calc(100% - 32px);padding:9px 12px;border:0;border-radius:10px;background:var(--soft);color:var(--tx);font-size:15px;outline:none}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.chart{padding:4px 12px}svg.c{width:100%;height:auto;display:block}
.v{width:14px;height:14px;vertical-align:-2px;margin-left:3px}
.new{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.row a.rl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-decoration:none;color:inherit}
.btn{border:0;font-family:inherit}.btn.red{background:#ed4956;color:#fff}.btn:disabled{opacity:.6;cursor:default}
header .btn{flex:none;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#262626;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;max-width:90%;font-size:14px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:30}
.modal>div{background:var(--bg);border-radius:14px;padding:20px;width:min(320px,90%)}
</style></head><body>
